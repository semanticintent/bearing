name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Bearing.sln

      - name: Build
        run: dotnet build Bearing.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Bearing.Core.Tests/Bearing.Core.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
